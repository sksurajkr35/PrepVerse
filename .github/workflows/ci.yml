name: CI

on:
  push:
  pull_request:

# Backend tests are pure unit + standalone MockMvc (no MySQL needed),
# so CI needs no services and stays fast.
jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + test
        run: mvn -B -ntp verify
        working-directory: backend

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prepverse/package-lock.json
      - name: Install
        run: npm ci
        working-directory: prepverse
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: prepverse
      - name: Production build
        run: npm run build
        working-directory: prepverse
