name: CI

on:
  push:
  pull_request:

# Backend tests are pure unit + standalone MockMvc (no MySQL needed),
# so CI needs no services and stays fast.
jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + test
        run: |
          set +e
          mvn -B -ntp verify > build.log 2>&1
          code=$?
          echo "--- failing excerpt (also emitted as annotations) ---"
          grep -E "ERROR|FAILURE|Tests run:|BUILD" build.log | head -40 || true
          grep -E "\[ERROR\]" build.log | head -25 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line:0:600}"; done
          echo "mvn exit code: $code"
          exit $code
        working-directory: backend

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prepverse/package-lock.json
      - name: Install
        run: npm ci
        working-directory: prepverse
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: prepverse
      - name: Production build
        run: npm run build
        working-directory: prepverse
