# ================= PrepVerse Backend =================
server.port=8080

# ================= MySQL =================
# Database is auto-created on first run (createDatabaseIfNotExist=true).
# Override with environment variables, e.g:
#   MYSQL_PASSWORD=mypass mvn spring-boot:run
spring.datasource.url=jdbc:mysql://localhost:3306/prepverse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (tables auto-created from @Entity classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================= JWT =================
# Use a long random secret in production (min 32 chars for HS256).
app.jwt.secret=${JWT_SECRET:prepverse-dev-secret-key-change-me-in-production-0123456789abcdef}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ================= Gemini AI Mentor =================
# Leave empty to use the built-in demo fallback responses.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.5-flash

# ================= Piston code execution =================
# Free public API, no key needed. Falls back to mock simulation if unreachable.
app.piston.base-url=https://emkc.org/api/v2/piston

# CORS: comma-separated allowed origins ("*" for development).
# In production set e.g. CORS_ALLOWED_ORIGINS=https://prepverse.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ================= Java 21 virtual threads =================
# Blocking calls (Piston, Gemini, MySQL) run on cheap virtual threads
# instead of platform threads - handles many concurrent users easily.
spring.threads.virtual.enabled=true

# ================= Logging =================
logging.level.com.prepverse=INFO
logging.level.org.hibernate.SQL=WARN
# File appender lives in logback-spring.xml; override dir via LOG_DIR env.

# ================= Actuator =================
management.endpoints.web.exposure.include=health,info,metrics,httpexchanges
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=PrepVerse
info.app.description=Placement preparation platform (Java + MySQL)
info.app.version=1.0.0
